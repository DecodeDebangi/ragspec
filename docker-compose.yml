# Postgres + pgvector for the BEIR benchmark pipelines in bench/.
services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      # Localhost only: this database shouldn't be reachable from the network.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ragspec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ragspec
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
