# The same hypothetical PR as ragspec.pr.yaml, on a free hosted LLM. Needs LLM_API_KEY.
# For Groq, use base_url https://api.groq.com/openai/v1 and model llama-3.3-70b-versatile, in both places.
label: "Bad PR (Gemini)"
description: "A simulated pull request: reads only 2 articles, is told to be helpful and confident, and has no citation rule."
subject: "a help-center chatbot for Nimbus, a made-up project management app"
dataset: questions.jsonl
pipeline:
  target: rag:make
  options:
    top_k: 2
    prompt: concise
    provider: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.5-flash-lite
k: [1, 4]
concurrency: 1       # free tiers allow only a few requests per minute
judge:
  provider: openai
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  model: gemini-3.5-flash-lite
  concurrency: 1
gate:
  min:
    faithfulness: 0.8
