# Baseline: the grounded prompt with top-4 retrieval.
label: "Good version (Claude)"
description: "Reads the 4 best-matching help articles. Must answer only from them and cite them."
subject: "a help-center chatbot for Nimbus, a made-up project management app"
dataset: questions.jsonl
pipeline:
  target: rag:make
  options: {top_k: 4, prompt: grounded}
k: [1, 4]
concurrency: 8
judge:
  model: claude-opus-5-5
  effort: medium
  concurrency: 8
gate:
  min:
    faithfulness: 0.8
